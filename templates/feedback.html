<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customer Feedback - {{ brand_name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --primary: #10b981;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 28px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 {
      margin-top: 0;
      color: var(--primary);
      text-align: center;
    }
    p.subtitle {
      color: var(--subtext);
      text-align: center;
      margin-top: -8px;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 0.9rem;
    }
    input[type="text"], textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: white;
      box-sizing: border-box;
      font-size: 1rem;
    }
    .rating-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .rating-item {
      flex: 1;
      text-align: center;
    }
    .rating-item select {
      text-align-last: center;
    }
    button.submit-btn {
      width: 100%;
      background: var(--primary);
      color: #042f2e;
      border: none;
      padding: 12px;
      font-size: 1.05rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 12px;
      transition: opacity 0.2s;
    }
    button.submit-btn:hover {
      opacity: 0.9;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: var(--subtext);
      text-decoration: none;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>We value your feedback!</h2>
    <p class="subtitle">{{ brand_name }} (Table {{ table if table else 'General' }})</p>
    
    <form method="POST">
      <input type="hidden" name="table" value="{{ table }}">
      <input type="hidden" name="session" value="{{ session }}">
      
      <div class="form-group">
        <label for="customer_name">Your Name (Optional)</label>
        <input type="text" id="customer_name" name="customer_name" placeholder="John Doe">
      </div>

      <div class="form-group">
        <label>Overall Experience</label>
        <select name="rating">
          <option value="5">⭐⭐⭐⭐⭐ Excellent (5/5)</option>
          <option value="4">⭐⭐⭐⭐ Very Good (4/5)</option>
          <option value="3">⭐⭐⭐ Average (3/5)</option>
          <option value="2">⭐⭐ Poor (2/5)</option>
          <option value="1">⭐ Very Bad (1/5)</option>
        </select>
      </div>

      <div class="form-group rating-row">
        <div class="rating-item">
          <label>Food Quality</label>
          <select name="food_rating">
            <option value="5">5/5</option>
            <option value="4">4/5</option>
            <option value="3">3/5</option>
            <option value="2">2/5</option>
            <option value="1">1/5</option>
          </select>
        </div>
        <div class="rating-item">
          <label>Service Speed</label>
          <select name="service_rating">
            <option value="5">5/5</option>
            <option value="4">4/5</option>
            <option value="3">3/5</option>
            <option value="2">2/5</option>
            <option value="1">1/5</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="comments">Comments & Suggestions</label>
        <textarea id="comments" name="comments" rows="3" placeholder="Tell us how we can make your dining experience better..."></textarea>
      </div>

      <button type="submit" class="submit-btn">Send Feedback</button>
    </form>
    {% if table and session %}
      <a href="{{ url_for('qr_public.order', table=table, session_id=session) }}" class="back-link">← Back to Menu</a>
    {% endif %}
  </div>
</body>
</html>
