<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You - {{ brand_name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 12px;
    }
    h2 {
      color: #10b981;
      margin: 0 0 10px 0;
    }
    p {
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    a.btn {
      display: inline-block;
      background: #10b981;
      color: #042f2e;
      text-decoration: none;
      font-weight: bold;
      padding: 12px 24px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✨🙏</div>
    <h2>Thank You!</h2>
    <p>Your feedback has been received and helps us continuously improve our food & service at {{ brand_name }}.</p>
    {% if table and session %}
      <a href="{{ url_for('qr_public.order', table=table, session_id=session) }}" class="btn">Return to Menu</a>
    {% else %}
      <a href="/" class="btn">Home</a>
    {% endif %}
  </div>
</body>
</html>
