<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Pilih Aksi — Meja {{ table_number }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/start_session.css')}}">
</head>
<body>
  <div class="wrap" style="max-width:720px;margin:24px auto;">
    <div class="card" style="text-align:center;">
      <h2>Meja {{ table_number }}</h2>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div style="margin:10px 0;">
            {% for cat, msg in messages %}
              <div class="flash {{ cat }}">{{ msg }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      {% if active_session_id %}
        <div style="margin:12px 0 18px;">
          <a class="btn" href="{{ url_for('sessions.view_session', table_number=table_number, session_id=active_session_id) }}">
            Masuk Sesi Aktif
          </a>
        </div>
      {% endif %}

      <div style="display:flex; gap:12px; justify-content:center; margin-top:12px;">
        <a class="btn primary" href="{{ url_for('sessions.start_session', table_number=table_number) }}">Buka Sesi</a>
        <a class="btn" href="{{ url_for('sessions.reserve_table', table_number=table_number) }}">Reservasi</a>
      </div>

      <div style="margin-top:16px;">
        <a class="btn" href="{{ url_for('dashboard.dashboard') }}">Kembali</a>
      </div>
    </div>
  </div>
</body>
</html>
